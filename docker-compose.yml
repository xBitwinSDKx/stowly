# Start:  docker compose up -d --build
# Vorher: .env.example nach .env kopieren und anpassen. STOWLY_PASSWORD ist seit 0.3.0 freiwillig:
# Leer legt es fest, wer die App zuerst öffnet (docs/betrieb.md, Abschnitt 19.2).
# Anleitung und Prüfliste: docs/betrieb.md. Ohne Kommandozeile, per Mausklick in DSM: Abschnitt 19.
# USB-Drucker direkt am Server (zuschaltbar): docker-compose.usb.yml
#
# Auf dem Entwicklungsrechner gibt es kein Docker. Gestartet ist Stowly so bisher auf einer Synology
# mit DSM 6.2.4 (docs/betrieb.md, Abschnitt 4.4).
services:
  stowly:
    # Ohne Angaben in .env: selbst bauen (docker compose up -d --build), das Image heißt stowly:local.
    # Mit STOWLY_IMAGE und STOWLY_VERSION: das fertige Image von GitHub (docker compose pull, dann
    # docker compose up -d); so arbeitet auch der Updater (docs/betrieb.md, Abschnitt 9).
    build: .
    image: ${STOWLY_IMAGE:-stowly}:${STOWLY_VERSION:-local}
    container_name: stowly
    restart: unless-stopped
    # Alle Variablen aus .env kommen so in den Container, auch die von Stufe 2 (Zeitzone, Sicherung,
    # Push, Home Assistant); beschrieben in .env.example.
    env_file:
      - .env
    ports:
      # Vorgabe: nur für einen Reverse Proxy auf demselben Rechner (auch Tailscale Serve).
      # Läuft der Proxy auf einem anderen Rechner, in .env STOWLY_PUBLISH=8010 setzen und den
      # Port in der Firewall auf das Heimnetz beschränken. Läuft er als Container auf diesem
      # Rechner, erreicht er 127.0.0.1 nicht: dann ein gemeinsames Netz, siehe docs/betrieb.md.
      # HTTPS durch Stowly selbst (Port 8443 im Container) steht hier absichtlich nicht: Auf 8443
      # liegt oft schon ein Reverse Proxy. Wer es will, legt docker-compose.override.yml mit
      # ports: ["8443:8443"] an und setzt STOWLY_PUBLISH=8010 (docs/betrieb.md, Abschnitt 20.2).
      - "${STOWLY_PUBLISH:-127.0.0.1:8010}:8010"
    volumes:
      # Alles, was Stowly speichert: die Datenbank (/data/stowly.sqlite3) samt Bildern, dazu der
      # Druck (/data/print: Auftragsspeicher jobs.sqlite3 und die PNG-Dateien des Bild-Treibers).
      # Sichern und Zurückspielen: docs/betrieb.md, Abschnitt 8.
      - stowly-data:/data
      # Automatische, verschlüsselte Sicherungen (STOWLY_BACKUP_DIR=/backups). Der Ordner muss dem
      # Benutzer des Containers gehören: mkdir -p backups && sudo chown 10001:10001 backups.
      # Er liegt auf derselben Platte und ersetzt keine Kopie außer Haus (docs/betrieb.md, 8.1).
      - ./backups:/backups
      # Läuft Home Assistant per https mit eigener Zertifizierungsstelle, kommt sie über
      # docker-compose.override.yml dazu (STOWLY_HA_CA, docs/betrieb.md, 17.4). Hier steht sie nicht:
      # Fehlt die Datei, legte Docker an ihrer Stelle einen Ordner an.
    # Der Prozess läuft ohne root und braucht keine besonderen Rechte.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Beim Beenden wartet der Server höchstens 5 Sekunden auf laufende Anfragen.
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  stowly-data:
