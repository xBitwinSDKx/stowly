# Journal auf dem Pi begrenzen (installiert von pi/install.sh nach
# /etc/systemd/journald.conf.d/stowly.conf).
#
# Das Journal liegt nur im Arbeitsspeicher: Die SD-Karte wird nicht beschrieben, und mit dem
# schreibgeschützten Overlay ginge ohnehin alles beim Neustart verloren. Der Pi Zero hat 512 MB,
# davon bekommt das Journal höchstens 16 MB.
[Journal]
Storage=volatile
RuntimeMaxUse=16M
RuntimeKeepFree=64M
MaxRetentionSec=1week
