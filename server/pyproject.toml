[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stowly-server"
version = "0.1.0"
description = "Stowly-Server: maßgeblicher Datenbestand, Sync-Schnittstelle, Anmeldung"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    # httpx2 ist der Nachfolger von httpx: für den Abruf bei Open Food Facts und für
    # den Test-Client von Starlette (der mit dem alten httpx nur noch unter Warnung läuft).
    "httpx2>=2.16,<3",
    "stowly-print",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "ruff>=0.17",
    # Für den Test der Sperrdatei (tests/test_requirements_lock.py): Anforderungen und Marker lesen.
    "packaging>=24",
]

[project.scripts]
stowly = "stowly.__main__:main"

[tool.setuptools.packages.find]
include = ["stowly*"]

[tool.setuptools.package-data]
stowly = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "allow_contract_violation: der Test prüft selbst, was bei einer vertragswidrigen Sync-Antwort geschieht",
]
