[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stowly-server"
version = "0.4.0"
description = "Stowly-Server: maßgeblicher Datenbestand, Sync-Schnittstelle, Anmeldung"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    # httpx2 ist der Nachfolger von httpx: für den Abruf bei Open Food Facts und für
    # den Test-Client von Starlette (der mit dem alten httpx nur noch unter Warnung läuft).
    "httpx2>=2.16,<3",
    # Web-Push: Verschlüsselung (RFC 8291) und Absender (RFC 8292), selbst geschrieben darauf.
    "cryptography>=50,<51",
    # Sicherungen: verschlüsselt im Format age an öffentliche Schlüssel.
    "pyrage>=1.4,<2",
    # Zeitzonendaten für zoneinfo: Windows und das schlanke Image bringen keine eigenen mit.
    "tzdata>=2026.6",
    "stowly-print",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "ruff>=0.17",
    # Für den Test der Sperrdatei (tests/test_requirements_lock.py): Anforderungen und Marker lesen.
    "packaging>=24",
]

[project.scripts]
stowly = "stowly.__main__:main"

[tool.setuptools.packages.find]
include = ["stowly*"]

[tool.setuptools.package-data]
# pi_install.sh: Vorlage des Startskripts für den Raspberry Pi (stowly/pi_bundle.py).
stowly = ["migrations/*.sql", "pi_install.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "allow_contract_violation: der Test prüft selbst, was bei einer vertragswidrigen Sync-Antwort geschieht",
]
