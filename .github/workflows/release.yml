# Release von Stowly (docs/betrieb.md, Abschnitt 9.4).
#
# Ausgelöst durch ein Tag vX.Y.Z (oder vX.Y.Z-rc.N für eine Vorabversion):
#   1. test:    alle Tests (Server, Druckdienst, Updater, Web-App) und die Prüfung des Vertrags,
#               aus tests.yml
#   2. image:   prüft die Versionsnummern im Code, baut das Image ohne die Brother-Bibliothek
#               (GPL-3.0) und lädt es nach ghcr.io/<konto>/stowly:X.Y.Z (bei einer echten Version
#               auch :latest)
#   3. release: erst wenn das Image da ist, das Release mit dem Abschnitt aus CHANGELOG.md; eine
#               echte Version als "latest" (die bietet der NAS an), eine Vorabversion als prerelease
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Dieselben Tests wie bei jedem Push auf main (tests.yml).
  test:
    uses: ./.github/workflows/tests.yml

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - uses: actions/checkout@v5

      # "latest" bekommt nur die höchste Version unter allen Tags vX.Y.Z: nie eine Vorabversion und
      # nie eine ältere Nummer, die später nachgereicht wird. Docker und GitHub nehmen "latest" dabei
      # von selbst der vorigen Version weg (ein Tag zeigt immer auf genau ein Image bzw. Release).
      - name: Version und Tags
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="${version%%-*}"
          python3 scripts/release.py --check "$base"
          git fetch --force --tags --quiet
          newest=$(git tag --list 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t . -k1,1n -k2,2n -k3,3n | tail -n 1)
          if [ "$version" = "$base" ] && [ "$version" = "$newest" ]; then latest=true; else latest=false; fi
          echo "Version $version, höchste Version $newest, latest: $latest"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stowly"
          {
            echo "version=$version"
            echo "image=$image"
            echo "latest=$latest"
            echo "tags<<EOF"
            echo "$image:$version"
            if [ "$latest" = true ]; then echo "$image:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: STOWLY_BROTHER=0
          push: true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Stowly
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Release mit dem Abschnitt aus CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="${version%%-*}"
          python3 scripts/release.py --notes "$base" > notes.md
          if [ "$version" != "$base" ]; then
            flags="--prerelease --latest=false"
          elif [ "${{ needs.image.outputs.latest }}" = "true" ]; then
            flags="--latest"
          else
            flags="--latest=false"
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Stowly $version" \
            --notes-file notes.md $flags
