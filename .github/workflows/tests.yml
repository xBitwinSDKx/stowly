# Tests von Stowly: bei jedem Push auf main und als erster Schritt jedes Releases (release.yml).
#
# Gescheiterte Tests erscheinen als Annotationen am Lauf (scripts/ci_pytest.sh, ruff im Format
# "github", vitest mit dem Reporter "github-actions"); die gibt GitHub auch ohne Anmeldung heraus.
name: Tests

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Druckdienst und Server editierbar wie in der Entwicklungsumgebung: Einige Tests prüfen den
      # Quellordner selbst (Vorgabepfade, erzeugte Vertragsdateien unter docs/ und web/).
      - name: Python-Pakete (Sperrdatei, Druckdienst, Server, Werkzeuge der Tests)
        run: |
          python -m pip install --no-deps --require-hashes --only-binary=:all: -r server/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ./print -e ./server
          python -m pip install --no-deps --no-build-isolation --require-hashes -r print/requirements-brother.txt
          python -m pip install "pytest>=9" "ruff>=0.17" "packaging>=24"

      - name: Ruff
        run: |
          python -m ruff check --output-format=github server print updater scripts
          python -m ruff format --check server print updater scripts

      - name: Tests des Servers (samt Prüfung des Vertrags)
        run: sh scripts/ci_pytest.sh server/tests

      - name: Tests des Druckdienstes
        if: success() || failure()
        run: sh scripts/ci_pytest.sh print/tests

      - name: Tests des Updaters
        if: success() || failure()
        run: sh scripts/ci_pytest.sh updater/tests

      - uses: actions/setup-node@v5
        if: success() || failure()
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web-App (Typen und Tests)
        if: success() || failure()
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- --reporter=default --reporter=github-actions
